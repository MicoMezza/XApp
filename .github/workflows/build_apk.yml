name: Build Android TV APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Configurazione JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurazione Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0 cmdline-tools;latest

      - name: Imposta permessi di esecuzione per Gradle
        run: chmod +x gradlew || true

      - name: Compilazione APK (Debug)
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Carica l'APK come Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-tv
          path: app/build/outputs/apk/debug/app-debug.apk
